<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemutar Indonesia Raya</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Pemutar Video Indonesia Raya</h1>
      <p>
        Aplikasi ini akan otomatis memutar video setiap hari pukul <strong>10:00</strong>.
      </p>

      <section class="controls">
        <label for="videoUrl">URL Video (MP4/WebM/Ogg)</label>
        <input
          id="videoUrl"
          type="url"
          placeholder="https://contoh.com/indonesia-raya.mp4"
        />
        <div class="button-group">
          <button id="saveUrlBtn">Simpan URL</button>
          <button id="playNowBtn" class="secondary">Putar Sekarang</button>
        </div>
      </section>

      <section class="player-card">
        <video id="anthemVideo" controls preload="auto"></video>
        <p id="statusText" class="status"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
